<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">🛍️ StoreName</a>
      <a href="checkout.html" class="btn btn-outline-light">
        🛒 Cart (<span id="cart-count">0</span>)
      </a>
    </div>
  </nav>

  <div class="container my-4">
    <h2 class="mb-4 text-center">Featured Products</h2>
    <div class="row" id="product-list">
      <!-- Products load dynamically -->
    </div>
  </div>

  <script>
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.qty, 0);

    async function fetchProducts() {
      const res = await fetch('/api/products');
      const products = await res.json();
      const container = document.getElementById('product-list');
      container.innerHTML = '';

      if (products.length === 0) {
        container.innerHTML = '<p class="text-center text-muted">No products available yet. Visit /admin.html to add some!</p>';
        return;
      }

      products.forEach(p => {
        container.innerHTML += `
          <div class="col-md-4 mb-4">
            <div class="card h-100 shadow-sm">
              <img src="${p.image}" class="card-img-top" style="height:220px; object-fit:cover;" alt="${p.title}">
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">${p.title}</h5>
                <p class="text-muted small">${p.description || ''}</p>
                <div class="mt-auto d-flex justify-content-between align-items-center">
                  <span class="fw-bold text-success">₦${Number(p.price).toLocaleString()}</span>
                  <button onclick="addToCart(${p.id}, '${p.title}', ${p.price})" class="btn btn-primary btn-sm">Add to Cart</button>
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }

    function addToCart(id, title, price) {
      let item = cart.find(i => i.id === id);
      if (item) {
        item.qty += 1;
      } else {
        cart.push({ id, title, price, qty: 1 });
      }
      localStorage.setItem('cart', JSON.stringify(cart));
      document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.qty, 0);
      alert(`${title} added to cart!`);
    }

    fetchProducts();
  </script>
</body>
</html>
