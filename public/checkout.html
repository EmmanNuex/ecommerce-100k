<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container my-5" style="max-width: 600px;">
    <a href="index.html" class="btn btn-sm btn-secondary mb-3">&larr; Back to Shop</a>
    
    <div class="card shadow-sm p-4">
      <h3 class="mb-3">Your Order</h3>
      <div id="cart-items" class="mb-3"></div>
      <h4 class="text-end">Total: <span id="cart-total" class="text-success">₦0</span></h4>

      <hr>

      <h4 class="mt-3">Customer Details</h4>
      <form id="checkout-form">
        <div class="mb-2">
          <label class="form-label">Full Name</label>
          <input type="text" id="cust-name" class="form-control" required>
        </div>
        <div class="mb-2">
          <label class="form-label">Phone Number</label>
          <input type="tel" id="cust-phone" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Delivery Address</label>
          <textarea id="cust-address" class="form-control" rows="2" required></textarea>
        </div>

        <!-- Bank Details Section -->
        <div class="alert alert-info">
          <h6>🏦 Bank Transfer Details:</h6>
          <p class="mb-1"><strong>Bank:</strong> GTBank / Access / Zenith</p>
          <p class="mb-1"><strong>Account Name:</strong> Client Store Name</p>
          <p class="mb-0"><strong>Account Number:</strong> 0123456789</p>
        </div>

        <button type="button" onclick="submitOrder()" class="btn btn-success w-100 py-2">
          Place Order via WhatsApp 💬
        </button>
      </form>
    </div>
  </div>

  <script>
    const VENDOR_WHATSAPP_NUMBER = "2348000000000"; // Replace with client's phone number

    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    function renderCart() {
      const container = document.getElementById('cart-items');
      const totalEl = document.getElementById('cart-total');
      container.innerHTML = '';
      let total = 0;

      if (cart.length === 0) {
        container.innerHTML = '<p class="text-muted">Your cart is empty.</p>';
        totalEl.innerText = '₦0';
        return;
      }

      cart.forEach((item, index) => {
        let itemTotal = item.price * item.qty;
        total += itemTotal;
        container.innerHTML += `
          <div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2">
            <div>
              <h6 class="mb-0">${item.title} (x${item.qty})</h6>
              <small class="text-muted">₦${item.price.toLocaleString()} each</small>
            </div>
            <div>
              <span class="fw-bold me-2">₦${itemTotal.toLocaleString()}</span>
              <button onclick="removeItem(${index})" class="btn btn-sm btn-outline-danger">&times;</button>
            </div>
          </div>
        `;
      });

      totalEl.innerText = `₦${total.toLocaleString()}`;
    }

    function removeItem(index) {
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    }

    function submitOrder() {
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const address = document.getElementById('cust-address').value.trim();

      if (!name || !phone || !address) {
        alert('Please complete all customer detail fields.');
        return;
      }

      if (cart.length === 0) {
        alert('Your cart is empty.');
        return;
      }

      let total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      
      let message = `Hello! I would like to place an order:%0A%0A`;
      message += `*Customer Details:*%0A`;
      message += `- Name: ${name}%0A`;
      message += `- Phone: ${phone}%0A`;
      message += `- Address: ${address}%0A%0A`;
      message += `*Order Items:*%0A`;

      cart.forEach((item) => {
        message += `- ${item.title} (x${item.qty}): ₦${(item.price * item.qty).toLocaleString()}%0A`;
      });

      message += `%0A*Total Amount:* ₦${total.toLocaleString()}%0A`;
      message += `I will transfer payment to your account shortly.`;

      localStorage.removeItem('cart');
      window.location.href = `https://wa.me/${VENDOR_WHATSAPP_NUMBER}?text=${message}`;
    }

    renderCart();
  </script>
</body>
</html>
